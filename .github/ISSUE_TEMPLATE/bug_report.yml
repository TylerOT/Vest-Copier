name: Report a problem
description: Something didn't copy, didn't fill, or behaved oddly.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way to report is from the copier itself: **⋯ → Report a problem** (or **Get help** next to a
        problem in the panel). It fills in this form and saves a report file for you to attach below.
  - type: input
    id: version
    attributes:
      label: Copier version
      description: Shown in the panel's bottom bar, e.g. v0.38.0.
      placeholder: "0.38.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Every release is tested on Chrome. If it only happens in another browser, please say so.
      options:
        - Chrome
        - Edge
        - Brave
        - Firefox
        - Other
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Which accounts, roughly when, and what you saw in the activity log.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: >-
        Drag the vest-copier-report-….json file here. It contains your activity log, diagnostics, settings and
        account balances (account ids are replaced by names), but no passwords or login tokens. Remove anything you
        don't want public.
    validations:
      required: true
